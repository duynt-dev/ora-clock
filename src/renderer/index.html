<!doctype html>
<html lang="en" data-theme="obsidian" data-face="flip">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob: file: https:;
  media-src 'self' blob: https:;
  font-src 'self' data:;
  connect-src 'self' https://api.spotify.com https://i.scdn.co https://www.youtube.com;
  frame-src https://www.youtube.com https://www.youtube-nocookie.com;
" />
<title>Ora Clock</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/themes.css" />
<link rel="stylesheet" href="css/glass.css" />
<link rel="stylesheet" href="css/clocks.css" />
<link rel="stylesheet" href="css/panel.css" />
</head>
<body>

<!-- SVG filters used by the "liquid" glass refraction layer -->
<svg class="svg-defs" aria-hidden="true">
  <defs>
    <filter id="liquid" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise">
        <animate attributeName="baseFrequency" dur="24s" values="0.008 0.012;0.012 0.008;0.008 0.012" repeatCount="indefinite" />
      </feTurbulence>
      <feGaussianBlur in="noise" stdDeviation="6" result="soft" />
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="26" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>

<div id="bg-layer">
  <div id="bg-media">
    <!-- stays here for the whole session: reparenting an iframe reloads it -->
    <div id="yt-host"><div id="yt-player"></div></div>
  </div>
  <div id="bg-veil"></div>
  <div id="bg-aurora"><span></span><span></span><span></span></div>
</div>

<header id="titlebar">
  <div class="drag-region"></div>

  <!-- macOS-style traffic lights: close · minimise · zoom -->
  <div class="traffic no-drag">
    <button class="light close" data-win="close" title="Hide to tray" aria-label="Hide to tray">
      <svg viewBox="0 0 12 12"><path d="M3.6 3.6l4.8 4.8M8.4 3.6l-4.8 4.8"/></svg>
    </button>
    <button class="light min" data-win="minimize" title="Minimise" aria-label="Minimise">
      <svg viewBox="0 0 12 12"><path d="M3 6h6"/></svg>
    </button>
    <button class="light zoom" data-win="maximize" title="Maximise" aria-label="Maximise">
      <svg viewBox="0 0 12 12"><path d="M3.4 8.6V4.2h4.4M8.6 3.4v4.4H4.2"/></svg>
    </button>
  </div>

  <div class="title-actions no-drag">
    <button class="tb-btn" data-win="pin" title="Keep on top (Ctrl+T)">
      <svg viewBox="0 0 24 24"><path d="M14 3v6l3 3v2H13v6l-1 2-1-2v-6H7v-2l3-3V3z"/></svg>
    </button>
    <button class="tb-btn" data-win="fullscreen" title="Full screen (F11)">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</header>

<main id="stage">
  <section id="clock-wrap">
    <div id="clock-host"></div>
    <div id="date-line"></div>
    <div id="world-strip"></div>
  </section>

  <div id="focus-hud" class="glass hidden">
    <div class="fh-label"></div>
    <div class="fh-time">25:00</div>
    <div class="fh-bar"><i></i></div>
    <div class="fh-actions">
      <button data-pomo="toggle" class="pill">Start</button>
      <button data-pomo="skip" class="pill ghost">Skip</button>
      <button data-pomo="stop" class="pill ghost">Close</button>
    </div>
  </div>
</main>

<div id="player-bar" class="glass hidden">
  <img id="pb-art" alt="" />
  <div class="pb-meta">
    <div id="pb-title">—</div>
    <div id="pb-artist"></div>
    <div class="pb-seek"><i></i></div>
  </div>
  <div class="pb-controls">
    <button data-pl="prev" title="Previous track"><svg viewBox="0 0 24 24"><path d="M18 6v12L9 12zM6 6v12"/></svg></button>
    <button data-pl="toggle" class="primary" title="Play / pause"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button>
    <button data-pl="next" title="Next track"><svg viewBox="0 0 24 24"><path d="M6 6v12l9-6zM18 6v12"/></svg></button>
    <div class="pb-vol">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9a4 4 0 010 6"/></svg>
      <input type="range" id="pb-volume" min="0" max="100" value="60" />
    </div>
  </div>
</div>

<nav id="dock" class="glass">
  <button data-dock="faces" title="Clock face"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Face</span></button>
  <button data-dock="themes" title="Theme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18 3 3 0 000-6 3 3 0 013-3h2a4 4 0 004-4 5 5 0 00-9-5z"/></svg><span>Theme</span></button>
  <button data-dock="music" title="Music"><svg viewBox="0 0 24 24"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg><span>Music</span></button>
  <button data-dock="tools" title="Tools"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg><span>Tools</span></button>
  <button data-dock="settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.7 1.7 0 008.9 19a1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1A1.7 1.7 0 004.6 8.9a1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span>Settings</span></button>
</nav>

<aside id="panel" class="glass" aria-hidden="true">
  <div class="panel-head">
    <div class="panel-tabs" id="panel-tabs"></div>
    <button id="panel-close" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</aside>

<div id="scrim"></div>
<div id="toast-host"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
